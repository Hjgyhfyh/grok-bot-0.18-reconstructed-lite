[package]
name = "grok-bot-lite"
version = "0.1.0"
description = "Grok Bot Lite — помощник для проектов"
edition = "2021"
license = "MIT"
default-run = "grok-bot-lite"

[profile.dev]
incremental = true

[lib]
# Суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с именем бинарника
# (проблема линковки только на Windows).
name = "grok_bot_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 8
strip = true
panic = "unwind"
